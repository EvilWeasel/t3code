name: Weasel CI

on:
  workflow_call:
    inputs:
      qualificationSourceSha:
        description: Exact unpublished source qualified by the trusted caller workflow
        required: true
        type: string
    outputs:
      qualifiedSourceSha:
        description: Source only after all existing platform gates pass
        value: ${{ jobs.qualification_receipt.outputs.source }}
  workflow_dispatch:
    inputs:
      buildCandidateCLI:
        description: Build an unpublished Linux x64 CLI/service candidate
        required: false
        default: false
        type: boolean
      candidateVersion:
        description: Exact unpublished CLI/service candidate version (nightly.DATE.RUN.CANDIDATE)
        required: false
        default: ""
        type: string
      probeProtonPass:
        description: Run the isolated synthetic Electron extension compatibility probe
        required: false
        default: false
        type: boolean
  push:
    branches: [main, "weasel/**"]
  pull_request:
    branches: [main, "weasel/**"]

concurrency:
  group: weasel-ci-${{ inputs.qualificationSourceSha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    if: (inputs.qualificationSourceSha != '' && github.repository == 'morrowbyte/t3code') || (inputs.qualificationSourceSha == '' && github.repository == (vars.WEASEL_RELEASE_REPOSITORY || 'EvilWeasel/t3code'))
    runs-on: ${{ vars.WEASEL_LINUX_RUNNER || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.qualificationSourceSha || github.sha }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Validate reusable source admission
        if: inputs.qualificationSourceSha != ''
        env:
          QUALIFICATION_SOURCE_SHA: ${{ inputs.qualificationSourceSha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = morrowbyte/t3code
          [[ "$QUALIFICATION_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$QUALIFICATION_SOURCE_SHA"
          test -z "$(git status --porcelain)"
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Prepare pinned Electron runtime before desktop imports
        run: node apps/desktop/scripts/ensure-electron-runtime.mjs
      - name: Run focused source gates
        run: bash scripts/weasel/check.sh
      - name: Lint conversational work-control slice
        run: >-
          vp lint --report-unused-disable-directives
          apps/web/src/components/chat/ChatComposer.tsx
          apps/web/src/voice/LiveVoiceControl.tsx
          apps/web/src/voice/LiveVoiceControl.test.tsx
          apps/server/src/orchestration-v2/Adapters/CodexAdapterV2.test.ts
          apps/server/src/orchestration-v2/Adapters/CodexAdapterV2.ts
          apps/server/src/voice/CodexLiveSessionService.test.ts
          apps/server/src/voice/CodexLiveSessionService.ts
          packages/provider-core/src/server/ProviderAdapter.ts
  product_bundle:
    needs: [check]
    if: github.event_name == 'workflow_dispatch' || inputs.qualificationSourceSha != ''
    runs-on: ${{ vars.WEASEL_LINUX_RUNNER || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.qualificationSourceSha || github.sha }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install bundle dependencies
        run: vp install --frozen-lockfile --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...
      - name: Validate explicit unpublished candidate inputs
        env:
          QUALIFICATION_SOURCE_SHA: ${{ inputs.qualificationSourceSha }}
          BUILD_CANDIDATE_CLI: ${{ inputs.buildCandidateCLI || false }}
          CANDIDATE_VERSION: ${{ inputs.candidateVersion }}
          SOURCE_SHA: ${{ inputs.qualificationSourceSha || github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -n "$QUALIFICATION_SOURCE_SHA" ]]; then
            test "$GITHUB_REPOSITORY" = morrowbyte/t3code
            test "$BUILD_CANDIDATE_CLI" = false
            test -z "$CANDIDATE_VERSION"
            test "$(git rev-parse HEAD)" = "$QUALIFICATION_SOURCE_SHA"
          fi
          if [[ "$BUILD_CANDIDATE_CLI" != true ]]; then
            test -z "$CANDIDATE_VERSION"
            exit 0
          fi
          test "$SOURCE_REPOSITORY" = morrowbyte/t3code
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          [[ "$CANDIDATE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-nightly\.[0-9]{8}\.[1-9][0-9]*\.[1-9][0-9]*$ ]]
          node scripts/update-release-package-versions.ts "$CANDIDATE_VERSION"
      - name: Build product bundle without publishing
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config
          vp run build:desktop
      - name: Capture synthetic voice UI across sizes and themes
        run: node scripts/weasel/voice-ui-artifact.mjs
      - name: Preserve visual fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-ui-${{ inputs.qualificationSourceSha || github.sha }}
          path: product-evidence/voice-ui
          if-no-files-found: warn
          retention-days: 7
      - name: Probe synthetic Proton extension compatibility on pinned Electron
        if: inputs.probeProtonPass
        timeout-minutes: 5
        env:
          MORROWBYTE_CI_PROBE: "1"
          MORROWBYTE_CI_PROFILE: blacksmith-8vcpu-ubuntu-2404
          SOURCE_SHA: ${{ inputs.qualificationSourceSha || github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = morrowbyte/t3code
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node --test apps/desktop/scripts/proton-pass-compatibility.test.mjs
          sudo apt-get install -y xvfb
          proton_probe_electron="$(node apps/desktop/scripts/ensure-electron-runtime.mjs)"
          xvfb-run --auto-servernum node apps/desktop/scripts/proton-pass-compatibility.test.mjs --electron "$proton_probe_electron" --output "$RUNNER_TEMP/proton-pass-compatibility"
      - name: Preserve isolated Electron compatibility receipts
        if: always() && inputs.probeProtonPass
        uses: actions/upload-artifact@v4
        with:
          name: proton-pass-compatibility-${{ inputs.qualificationSourceSha || github.sha }}
          path: |
            ${{ runner.temp }}/proton-pass-compatibility/fixture-receipt.json
            ${{ runner.temp }}/proton-pass-compatibility/fixture-receipt.partial.json
            ${{ runner.temp }}/proton-pass-compatibility/runner-receipt.json
            ${{ runner.temp }}/proton-pass-compatibility/electron.log
          if-no-files-found: error
          retention-days: 7
      - name: Setup Linux candidate Rust target
        if: inputs.buildCandidateCLI
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Build complete unpublished Linux CLI candidate
        if: inputs.buildCandidateCLI
        env:
          VP_NODE_VERSION: "26.8.2"
          CANDIDATE_VERSION: ${{ inputs.candidateVersion }}
          SOURCE_SHA: ${{ inputs.qualificationSourceSha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node apps/server/scripts/cli.ts build-exe --verbose
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu
          monitor_dir="$RUNNER_TEMP/cli-candidate-resource-monitor/linux-x64"
          mkdir -p "$monitor_dir"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$monitor_dir/"
          node scripts/build-cli-archive.ts --platform linux --arch x64 --version "$CANDIDATE_VERSION" --resource-monitor-dir "$RUNNER_TEMP/cli-candidate-resource-monitor" --output-dir product-evidence/linux-cli
          node scripts/smoke-cli-archive.ts --archive "product-evidence/linux-cli/t3-$CANDIDATE_VERSION-linux-x64.tar.gz" --expect-version "$CANDIDATE_VERSION"
          preflight_dir="$(mktemp -d "$RUNNER_TEMP/cli-candidate-preflight.XXXXXX")"
          tar -xf "product-evidence/linux-cli/t3-$CANDIDATE_VERSION-linux-x64.tar.gz" -C "$preflight_dir" --strip-components=1
          "$preflight_dir/t3" __service-preflight --database-path "$preflight_dir/preflight.sqlite" --launcher-protocol 3 > product-evidence/linux-cli/SERVICE-PREFLIGHT.json
          jq -e --arg version "$CANDIDATE_VERSION" '.status == "ready" and .version == $version and .launcherProtocol == 3' product-evidence/linux-cli/SERVICE-PREFLIGHT.json
          printf 'kind=unpublished-cli-service-candidate\nnightly_feed_compatible=false\ndesktop_auto_install=false\nsource_sha=%s\nversion=%s\nrun_id=%s\nrun_attempt=%s\n' "$SOURCE_SHA" "$CANDIDATE_VERSION" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > product-evidence/linux-cli/CI-CANDIDATE-RECEIPT.txt
          sha256sum pnpm-lock.yaml >> product-evidence/linux-cli/CI-CANDIDATE-RECEIPT.txt
          (cd product-evidence/linux-cli && sha256sum ./*.tar.gz > SHA256SUMS)
      - name: Preserve unpublished Linux CLI candidate
        if: inputs.buildCandidateCLI
        uses: actions/upload-artifact@v4
        with:
          name: linux-cli-candidate-${{ inputs.qualificationSourceSha || github.sha }}
          path: product-evidence/linux-cli
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Bind bundle to exact source
        env:
          SOURCE_SHA: ${{ inputs.qualificationSourceSha || github.sha }}
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          TRUSTED_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p product-evidence
          printf 'source_sha=%s\nrun_id=%s\nrun_attempt=%s\n' "$SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > product-evidence/BUILD-RECEIPT.txt
          printf 'trusted_workflow_sha=%s\ntrusted_workflow_ref=%s\n' "$TRUSTED_WORKFLOW_SHA" "$TRUSTED_WORKFLOW_REF" >> product-evidence/BUILD-RECEIPT.txt
          sha256sum pnpm-lock.yaml >> product-evidence/BUILD-RECEIPT.txt
          find apps/server/dist apps/desktop/dist-electron -type f -print0 | sort -z | xargs -0 sha256sum > product-evidence/SHA256SUMS
          test -s product-evidence/SHA256SUMS
      - name: Upload reviewable product bundle
        uses: actions/upload-artifact@v4
        with:
          name: product-bundle-${{ inputs.qualificationSourceSha || github.sha }}
          include-hidden-files: true
          path: |
            apps/server/dist
            apps/desktop/dist-electron
            product-evidence
          if-no-files-found: error
          retention-days: 7
  windows_installer_guard:
    if: (inputs.qualificationSourceSha != '' && github.repository == 'morrowbyte/t3code') || (inputs.qualificationSourceSha == '' && github.repository == (vars.WEASEL_RELEASE_REPOSITORY || 'EvilWeasel/t3code'))
    runs-on: ${{ vars.WEASEL_WINDOWS_RUNNER || 'blacksmith-8vcpu-windows-2025' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.qualificationSourceSha || github.sha }}
          persist-credentials: false
      - name: Verify Windows installer process isolation
        shell: powershell
        run: ./apps/desktop/resources/test-morrowbyte-installer-guard.ps1

  qualification_receipt:
    if: inputs.qualificationSourceSha != ''
    needs: [check, product_bundle, windows_installer_guard]
    runs-on: ${{ vars.WEASEL_LINUX_RUNNER || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    outputs:
      source: ${{ steps.receipt.outputs.source }}
    steps:
      - name: Bind successful normal gates to source and trusted workflow
        id: receipt
        env:
          SOURCE_SHA: ${{ inputs.qualificationSourceSha }}
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          TRUSTED_WORKFLOW_REF: ${{ github.workflow_ref }}
          CHECK: ${{ needs.check.result }}
          PRODUCT: ${{ needs.product_bundle.result }}
          WINDOWS: ${{ needs.windows_installer_guard.result }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = morrowbyte/t3code
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$CHECK" = success
          test "$PRODUCT" = success
          test "$WINDOWS" = success
          mkdir qualification
          printf 'source_sha=%s\ntrusted_workflow_sha=%s\ntrusted_workflow_ref=%s\nrun_id=%s\nrun_attempt=%s\ncheck=success\nproduct_bundle=success\nwindows_installer_guard=success\n' "$SOURCE_SHA" "$TRUSTED_WORKFLOW_SHA" "$TRUSTED_WORKFLOW_REF" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > qualification/receipt.txt
          printf 'source=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: sync-qualification-${{ inputs.qualificationSourceSha }}
          path: qualification/receipt.txt
          if-no-files-found: error
          retention-days: 30
