name: Weasel CI

on:
  push:
    branches: [main, "weasel/**"]
  pull_request:
    branches: [main, "weasel/**"]

concurrency:
  group: weasel-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    if: github.repository == (vars.WEASEL_RELEASE_REPOSITORY || 'EvilWeasel/t3code')
    runs-on: ${{ vars.WEASEL_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Run focused source gates
        run: bash scripts/weasel/check.sh
