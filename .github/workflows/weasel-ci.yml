name: Weasel CI

on:
  workflow_dispatch:
    inputs:
      nativeRpcDiagnostic:
        description: Run the bounded serialized native RPC compiler diagnostic only
        required: false
        default: false
        type: boolean
      buildCandidateCLI:
        description: Build an unpublished Linux x64 CLI/service candidate
        required: false
        default: false
        type: boolean
      candidateVersion:
        description: Exact unpublished CLI/service candidate version (nightly.DATE.RUN.CANDIDATE)
        required: false
        default: ""
        type: string
      probeProtonPass:
        description: Run the isolated synthetic Electron extension compatibility probe
        required: false
        default: false
        type: boolean
  push:
    branches: [main, "weasel/**"]
  pull_request:
    branches: [main, "weasel/**"]

concurrency:
  group: weasel-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    if: github.repository == (vars.WEASEL_RELEASE_REPOSITORY || 'EvilWeasel/t3code') && !(github.event_name == 'workflow_dispatch' && inputs.nativeRpcDiagnostic)
    runs-on: ${{ vars.WEASEL_LINUX_RUNNER || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Prepare pinned Electron runtime before desktop imports
        run: node apps/desktop/scripts/ensure-electron-runtime.mjs
      - name: Capture emulated mobile composer before source gates
        if: (github.ref_name == 'feature/mobile-composer-hotfix-candidate-20261016' || github.ref_name == 'feature/live-native-selected-start-candidate-20261016')
        run: |
          test "$GITHUB_REPOSITORY" = morrowbyte/t3code
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin b6525bb5fe4343ea5612ba5e9ec8e1a0b2482791
          node scripts/weasel/voice-ui-artifact.mjs "$RUNNER_TEMP/composer-mobile" --composer-mobile
      - name: Preserve emulated mobile composer development evidence
        if: always() && (github.ref_name == 'feature/mobile-composer-hotfix-candidate-20261016' || github.ref_name == 'feature/live-native-selected-start-candidate-20261016')
        uses: actions/upload-artifact@v4
        with:
          name: composer-mobile-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/composer-mobile
          if-no-files-found: error
          retention-days: 7
      - name: Run focused source gates
        env:
          EFFECTIVE_SOURCE_SHA: ${{ inputs.qualificationSourceSha || github.sha }}
        run: |
          [[ "$EFFECTIVE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EFFECTIVE_SOURCE_SHA"
          bash scripts/weasel/check.sh
      - name: Preserve unreviewed Observatory route generation
        if: always() && (github.ref_name == 'feature/agent-observatory-candidate-20261016' || github.ref_name == 'feature/desktop-control-bootstrap-396-20261016')
        uses: actions/upload-artifact@v4
        with:
          name: observatory-routes-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/observatory-route-generation/receipt.json
            ${{ runner.temp }}/observatory-route-generation/routeTree.gen.ts
            ${{ runner.temp }}/observatory-route-generation/routeTree.diff
          if-no-files-found: error
          retention-days: 7
      - name: Lint conversational work-control slice
        run: >-
          vp lint --report-unused-disable-directives
          apps/web/src/components/chat/ChatComposer.tsx
          apps/web/src/voice/LiveVoiceControl.tsx
          apps/web/src/voice/LiveVoiceControl.test.tsx
          apps/server/src/orchestration-v2/Adapters/CodexAdapterV2.test.ts
          apps/server/src/orchestration-v2/Adapters/CodexAdapterV2.ts
          apps/server/src/voice/CodexLiveSessionService.test.ts
          apps/server/src/voice/CodexLiveSessionService.ts
          packages/provider-core/src/server/ProviderAdapter.ts
  product_bundle:
    needs: [check]
    if: github.event_name == 'workflow_dispatch' && !inputs.nativeRpcDiagnostic
    runs-on: ${{ vars.WEASEL_LINUX_RUNNER || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install bundle dependencies
        run: vp install --frozen-lockfile --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...
      - name: Validate explicit unpublished candidate inputs
        env:
          BUILD_CANDIDATE_CLI: ${{ inputs.buildCandidateCLI || false }}
          CANDIDATE_VERSION: ${{ inputs.candidateVersion }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_CANDIDATE_CLI" != true ]]; then
            test -z "$CANDIDATE_VERSION"
            exit 0
          fi
          test "$SOURCE_REPOSITORY" = morrowbyte/t3code
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          [[ "$CANDIDATE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-nightly\.[0-9]{8}\.[1-9][0-9]*\.[1-9][0-9]*$ ]]
          node scripts/update-release-package-versions.ts "$CANDIDATE_VERSION"
      - name: Build product bundle without publishing
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config
          vp run build:desktop
      - name: Capture synthetic voice UI across sizes and themes
        run: node scripts/weasel/voice-ui-artifact.mjs
      - name: Preserve visual fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-ui-${{ github.sha }}
          path: product-evidence/voice-ui
          if-no-files-found: warn
          retention-days: 7
      - name: Probe synthetic Proton extension compatibility on pinned Electron
        if: inputs.probeProtonPass
        timeout-minutes: 5
        env:
          MORROWBYTE_CI_PROBE: "1"
          MORROWBYTE_CI_PROFILE: blacksmith-8vcpu-ubuntu-2404
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = morrowbyte/t3code
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --test apps/desktop/scripts/proton-pass-compatibility.test.mjs
          sudo apt-get install -y xvfb
          proton_probe_electron="$(node apps/desktop/scripts/ensure-electron-runtime.mjs)"
          xvfb-run --auto-servernum node apps/desktop/scripts/proton-pass-compatibility.test.mjs --electron "$proton_probe_electron" --output "$RUNNER_TEMP/proton-pass-compatibility"
      - name: Preserve isolated Electron compatibility receipts
        if: always() && inputs.probeProtonPass
        uses: actions/upload-artifact@v4
        with:
          name: proton-pass-compatibility-${{ github.sha }}
          path: |
            ${{ runner.temp }}/proton-pass-compatibility/fixture-receipt.json
            ${{ runner.temp }}/proton-pass-compatibility/fixture-receipt.partial.json
            ${{ runner.temp }}/proton-pass-compatibility/runner-receipt.json
            ${{ runner.temp }}/proton-pass-compatibility/electron.log
          if-no-files-found: error
          retention-days: 7
      - name: Setup Linux candidate Rust target
        if: inputs.buildCandidateCLI
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Build complete unpublished Linux CLI candidate
        if: inputs.buildCandidateCLI
        env:
          VP_NODE_VERSION: "26.8.2"
          CANDIDATE_VERSION: ${{ inputs.candidateVersion }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node apps/server/scripts/cli.ts build-exe --verbose
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu
          monitor_dir="$RUNNER_TEMP/cli-candidate-resource-monitor/linux-x64"
          mkdir -p "$monitor_dir"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$monitor_dir/"
          node scripts/build-cli-archive.ts --platform linux --arch x64 --version "$CANDIDATE_VERSION" --resource-monitor-dir "$RUNNER_TEMP/cli-candidate-resource-monitor" --output-dir product-evidence/linux-cli
          node scripts/smoke-cli-archive.ts --archive "product-evidence/linux-cli/t3-$CANDIDATE_VERSION-linux-x64.tar.gz" --expect-version "$CANDIDATE_VERSION"
          preflight_dir="$(mktemp -d "$RUNNER_TEMP/cli-candidate-preflight.XXXXXX")"
          tar -xf "product-evidence/linux-cli/t3-$CANDIDATE_VERSION-linux-x64.tar.gz" -C "$preflight_dir" --strip-components=1
          "$preflight_dir/t3" __service-preflight --database-path "$preflight_dir/preflight.sqlite" --launcher-protocol 3 > product-evidence/linux-cli/SERVICE-PREFLIGHT.json
          jq -e --arg version "$CANDIDATE_VERSION" '.status == "ready" and .version == $version and .launcherProtocol == 3' product-evidence/linux-cli/SERVICE-PREFLIGHT.json
          printf 'kind=unpublished-cli-service-candidate\nnightly_feed_compatible=false\ndesktop_auto_install=false\nsource_sha=%s\nversion=%s\nrun_id=%s\nrun_attempt=%s\n' "$SOURCE_SHA" "$CANDIDATE_VERSION" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > product-evidence/linux-cli/CI-CANDIDATE-RECEIPT.txt
          sha256sum pnpm-lock.yaml >> product-evidence/linux-cli/CI-CANDIDATE-RECEIPT.txt
          (cd product-evidence/linux-cli && sha256sum ./*.tar.gz > SHA256SUMS)
      - name: Preserve unpublished Linux CLI candidate
        if: inputs.buildCandidateCLI
        uses: actions/upload-artifact@v4
        with:
          name: linux-cli-candidate-${{ github.sha }}
          path: product-evidence/linux-cli
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Bind bundle to exact source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p product-evidence
          printf 'source_sha=%s\nrun_id=%s\nrun_attempt=%s\n' "$SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > product-evidence/BUILD-RECEIPT.txt
          sha256sum pnpm-lock.yaml >> product-evidence/BUILD-RECEIPT.txt
          if [[ -f apps/web/src/routes/observatory.tsx ]]; then
            test -s apps/web/src/routeTree.gen.ts
            grep -q '/observatory' apps/web/src/routeTree.gen.ts
            printf 'generated_route_sha256=%s\n' "$(sha256sum apps/web/src/routeTree.gen.ts | cut -d' ' -f1)" >> product-evidence/BUILD-RECEIPT.txt
          fi
          find apps/server/dist apps/desktop/dist-electron -type f -print0 | sort -z | xargs -0 sha256sum > product-evidence/SHA256SUMS
          test -s product-evidence/SHA256SUMS
      - name: Upload reviewable product bundle
        uses: actions/upload-artifact@v4
        with:
          name: product-bundle-${{ github.sha }}
          include-hidden-files: true
          path: |
            apps/server/dist
            apps/desktop/dist-electron
            product-evidence
          if-no-files-found: error
          retention-days: 7
  windows_installer_guard:
    if: github.repository == (vars.WEASEL_RELEASE_REPOSITORY || 'EvilWeasel/t3code') && !(github.event_name == 'workflow_dispatch' && inputs.nativeRpcDiagnostic)
    runs-on: ${{ vars.WEASEL_WINDOWS_RUNNER || 'blacksmith-8vcpu-windows-2025' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify Windows installer process isolation
        shell: powershell
        run: ./apps/desktop/resources/test-morrowbyte-installer-guard.ps1

  native_rpc_diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.nativeRpcDiagnostic && github.repository == 'morrowbyte/t3code' && github.ref_name == 'feature/live-native-rpc-diagnostic-20261016'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Run bounded serialized RPC compiler diagnostic
        env:
          EXPECTED_LOCK_SHA: 92d93fb6cc31e4f7da200e8e0d78c6fd178c1e8d5d78d9a63e2873e617f2d269
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)" = "$EXPECTED_LOCK_SHA"
          test "$(sha256sum packages/contracts/src/rpc.test.ts | cut -d' ' -f1)" = 519ce3fc86f91114f061c07fb41e71018929f2b6a8c0265544262367bd2606a5
          test "$(sha256sum apps/server/src/observability/RpcInstrumentation.test.ts | cut -d' ' -f1)" = 9dc5770bf9d0f099dc60f7fc5bc737e83078784cbac8115bc8a63c03745ad525
          diagnostic_dir="$RUNNER_TEMP/native-rpc-diagnostic"
          mkdir -m 700 "$diagnostic_dir"
          export DIAGNOSTIC_DIR="$diagnostic_dir"
          set +e
          vp run --filter=@t3tools/contracts typecheck > "$diagnostic_dir/contracts.log" 2>&1
          contracts_exit=$?
          server_exit=SERVER_FAILED_UNCHANGED
          tests_exit=NOT_REACHED
          if [[ "$contracts_exit" == 0 ]]; then
            vp test run packages/contracts/src/rpc.test.ts apps/server/src/observability/RpcInstrumentation.test.ts > "$diagnostic_dir/tests.log" 2>&1
            tests_exit=$?
          fi
          set -e
          export CONTRACTS_EXIT="$contracts_exit" SERVER_EXIT="$server_exit" TESTS_EXIT="$tests_exit"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const hash=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const tests=['packages/contracts/src/rpc.test.ts','apps/server/src/observability/RpcInstrumentation.test.ts'];
          const logs=fs.readdirSync(process.env.DIAGNOSTIC_DIR).filter(n=>n.endsWith('.log')).map(name=>{
            const path=process.env.DIAGNOSTIC_DIR+'/'+name;
            const bytes=fs.statSync(path).size;
            if(bytes>4*1024*1024) throw Error('Diagnostic log exceeds bound');
            return {name,bytes,sha256:hash(path)};
          });
          fs.writeFileSync(process.env.DIAGNOSTIC_DIR+'/receipt.json',JSON.stringify({kind:'bounded-diagnostic-not-qualification',source:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,lockSha256:hash('pnpm-lock.yaml'),tests:tests.map(path=>({path,sha256:hash(path)})),commands:['vp run --filter=@t3tools/contracts typecheck','vp test run packages/contracts/src/rpc.test.ts apps/server/src/observability/RpcInstrumentation.test.ts'],exits:{contracts:Number(process.env.CONTRACTS_EXIT),server:process.env.SERVER_EXIT,tests:process.env.TESTS_EXIT==='NOT_REACHED'?'NOT_REACHED':Number(process.env.TESTS_EXIT)},retainedServerFailure:{run:38868821857,source:'a17513ba57cf8818cde8a62fa160f0c526a6dcbf',matrixSha256:'a9f9addbb9f6dfe41613300dc6ee319d0dca52163182b2c323003413f7c1d2ab',requirementsErrors:33,depthErrors:3,status:'SERVER_FAILED_UNCHANGED'},productionCompile:'BLOCKED',nativeUiTransport:'NOT_ACCEPTED',fullQualification:false,logs},null,2)+'\n',{flag:'wx',mode:0o600});
          NODE
          test "$contracts_exit" == 0
          test "$tests_exit" == 0
      - name: Preserve bounded serialized RPC diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-rpc-diagnostic-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-rpc-diagnostic
          if-no-files-found: error
          retention-days: 7
