name: Promote verified Weasel candidate without rebuilding
run-name: Promote verified 0.1.2-nightly.20261016.36 from candidate 38943743329
on:
  workflow_dispatch:
    inputs:
      source_sha:
        type: string
        required: true
        default: 7135fab0a9b001751943684e055b953c125d4c55
      candidate_run:
        type: string
        required: true
        default: "38943743329"
      version:
        type: string
        required: true
        default: 0.1.2-nightly.20261016.36
      candidate_receipt:
        type: string
        required: true
        description: Exact approved synthetic E2E receipt JSON; SHA256 is pinned in this workflow
concurrency:
  group: weasel-desktop-nightly
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  publish:
    if: github.repository == 'morrowbyte/t3code' && github.ref == 'refs/heads/ops/promote-verified-voice-36-20261016'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout verified product source
        uses: actions/checkout@v4
        with:
          ref: 7135fab0a9b001751943684e055b953c125d4c55
          fetch-depth: 0
      - name: Set up checksum runtime only; no install or build
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify candidate provenance and download exact artifact ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: 7135fab0a9b001751943684e055b953c125d4c55
          CANDIDATE_RUN_ID: "38943743329"
          VERSION: 0.1.2-nightly.20261016.36
          CANDIDATE_PROOF_SHA256: 01cf3cdc91c0b7364bcf8ec78243d08afc43c4df539e2097557a32f69abb2222
          INPUT_SOURCE: ${{ inputs.source_sha }}
          INPUT_RUN: ${{ inputs.candidate_run }}
          INPUT_VERSION: ${{ inputs.version }}
          CANDIDATE_PROOF: ${{ inputs.candidate_receipt }}
        run: |-
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = morrowbyte/t3code
          test "$GITHUB_REF" = refs/heads/ops/promote-verified-voice-36-20261016
          test "$INPUT_SOURCE" = "$SOURCE_SHA"
          test "$INPUT_RUN" = "$CANDIDATE_RUN_ID"
          test "$INPUT_VERSION" = "$VERSION"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          bash scripts/weasel/verify-desktop-source.sh "$SOURCE_SHA" true "$GITHUB_REF" "$GITHUB_SHA"
          git fetch --no-tags origin "$GITHUB_SHA"
          test "$(git diff --name-only "$SOURCE_SHA" "$GITHUB_SHA")" = .github/workflows/weasel-release.yml
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,zipfile,stat,shutil
          repo='morrowbyte/t3code'; source=os.environ['SOURCE_SHA']; candidate=int(os.environ['CANDIDATE_RUN_ID'])
          temporary=pathlib.Path(os.environ['RUNNER_TEMP'])/'verified-candidate-promotion'; temporary.mkdir()
          def api(suffix):
              return json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/'+suffix],timeout=30))
          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(1024*1024),b''): h.update(b)
              return h.hexdigest()
          proof_bytes=os.environ['CANDIDATE_PROOF'].encode()
          assert hashlib.sha256(proof_bytes).hexdigest()==os.environ['CANDIDATE_PROOF_SHA256']
          proof=json.loads(proof_bytes)
          assert proof['sourceSha']==source and proof['version']==os.environ['VERSION']
          assert proof['overall']=='PASS_ISOLATED_NATIVE_DRAFT_SYNTHETIC_E2E_AWAIT_ROOT_MAIN_PUBLICATION'
          assert proof['nativeBuild']['run']['id']==candidate and proof['nativeBuild']['publish'] is False
          assert proof['physicalCaptureGuardCalls']==0 and proof['attempts'][-1]['result']=='PASS'
          r=api('actions/runs/'+str(candidate))
          assert r['repository']['full_name']==repo and r['head_repository']['full_name']==repo
          assert r['head_sha']==source and r['head_branch']=='fix/native-chatgpt-livevoice-20261016'
          assert r['event']=='workflow_dispatch' and r['path']=='.github/workflows/weasel-release.yml'
          assert r['status']=='completed' and r['conclusion']=='success' and r['run_attempt']==1 and r['run_number']==36
          assert r['created_at'][:10].replace('-','')=='20261016'
          j=api('actions/runs/'+str(candidate)+'/attempts/1/jobs?per_page=100')
          assert len(j['jobs'])==j['total_count'] and j['total_count']<=100
          for name in ['preflight','build_bundle','build_linux','build_nixos','build_windows']:
              rows=[x for x in j['jobs'] if x['name']==name]
              assert len(rows)==1 and rows[0]['run_id']==candidate and rows[0]['status']=='completed' and rows[0]['conclusion']=='success'
              expected='blacksmith-8vcpu-windows-2025' if name=='build_windows' else 'blacksmith-8vcpu-ubuntu-2404'
              assert expected in rows[0]['labels']
          published=[x for x in j['jobs'] if x['name']=='publish']
          assert len(published)==1 and published[0]['conclusion']=='skipped'
          a=api('actions/runs/'+str(candidate)+'/artifacts?per_page=100')
          assert len(a['artifacts'])==a['total_count'] and a['total_count']<=100
          names=['weasel-release-linux','weasel-release-cli-linux','weasel-release-windows','weasel-release-cli-windows','weasel-release-nixos',
                 'weasel-observatory-preflight-'+source+'-1','weasel-observatory-build-'+source+'-1']
          release=pathlib.Path('release-assets'); release.mkdir()
          manifest=[]
          for name in names:
              rows=[x for x in a['artifacts'] if x['name']==name]
              assert len(rows)==1
              item=rows[0]; assert item['expired'] is False and item['workflow_run']['id']==candidate and item['workflow_run']['head_sha']==source
              assert item['digest'].startswith('sha256:') and len(item['digest'])==71
              if name=='weasel-release-nixos':
                  assert item['id']==proof['artifact']['artifactId'] and item['digest']=='sha256:'+proof['artifact']['artifactZipSha256']
              archive=temporary/(name+'.zip')
              with archive.open('xb') as output:
                  subprocess.run(['gh','api','repos/'+repo+'/actions/artifacts/'+str(item['id'])+'/zip'],stdout=output,check=True,timeout=600)
              assert 'sha256:'+sha(archive)==item['digest']
              dest=release if name.startswith('weasel-release-') else pathlib.Path(os.environ['RUNNER_TEMP'])/('observatory-publish-preflight' if 'preflight' in name else 'observatory-publish-build')
              if dest!=release: dest.mkdir()
              seen=set()
              with zipfile.ZipFile(archive) as z:
                  for entry in z.infolist():
                      p=pathlib.PurePosixPath(entry.filename); mode=(entry.external_attr>>16)&0o170000
                      assert not p.is_absolute() and p.parts and all(x not in ('','.','..') for x in p.parts)
                      assert '\\' not in entry.filename and ':' not in entry.filename and mode in (0,stat.S_IFREG,stat.S_IFDIR)
                      key=entry.filename.casefold(); assert key not in seen; seen.add(key)
                      out=dest.joinpath(*p.parts); assert out.resolve().is_relative_to(dest.resolve())
                      if entry.is_dir(): out.mkdir(parents=True,exist_ok=True); continue
                      if dest==release: assert len(p.parts)==1 and out.name not in ('SHA256SUMS','RELEASE-RECEIPT.txt')
                      out.parent.mkdir(parents=True,exist_ok=True)
                      with z.open(entry) as src,out.open('xb') as dst: shutil.copyfileobj(src,dst)
              manifest.append({k:item[k] for k in ('id','name','size_in_bytes','digest')})
          (temporary/'candidate-run.json').write_text(json.dumps(r,indent=2)+'\n')
          (temporary/'candidate-jobs.json').write_text(json.dumps(j,indent=2)+'\n')
          (temporary/'artifact-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          (temporary/'candidate-proof-sha256.txt').write_text(os.environ['CANDIDATE_PROOF_SHA256']+'\n')
          PY
      - name: Require matching Observatory route proofs before publication
        env:
          SOURCE_SHA: 7135fab0a9b001751943684e055b953c125d4c55
          PREFLIGHT_ROUTE_SHA: 4a398647bcd2507fd8aabab1ea0119b5bb635ccb880f4c73f0570f533650480e
          CANDIDATE_RUN_ID: "38943743329"
          CANDIDATE_RUN_ATTEMPT: "1"
          CANDIDATE_WORKFLOW_REF: morrowbyte/t3code/.github/workflows/weasel-release.yml@refs/heads/fix/native-chatgpt-livevoice-20261016
        run: |
          set -euo pipefail
          if [[ ! -f apps/web/src/routes/observatory.tsx ]]; then
            test -z "$PREFLIGHT_ROUTE_SHA"
            exit 0
          fi
          python3 - <<'PYROUTE'
          import hashlib, json, os, pathlib, subprocess
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          expected = '4a398647bcd2507fd8aabab1ea0119b5bb635ccb880f4c73f0570f533650480e'
          source = os.environ['SOURCE_SHA']
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == source
          assert os.environ['PREFLIGHT_ROUTE_SHA'] == expected
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          preflight = root / 'observatory-publish-preflight'
          build = root / 'observatory-publish-build'
          pre = json.loads((preflight / 'receipt.json').read_bytes())
          built = json.loads((build / 'receipt.json').read_bytes())
          for receipt in [pre, built]:
              assert receipt['source'] == source
              assert receipt['run'] == os.environ['CANDIDATE_RUN_ID'] and receipt['attempt'] == os.environ['CANDIDATE_RUN_ATTEMPT']
              assert receipt['lockSha256'] == digest(pathlib.Path('pnpm-lock.yaml'))
              assert receipt['trustedContextSha'] == os.environ['SOURCE_SHA']
              assert receipt['trustedWorkflowSha'] == os.environ['SOURCE_SHA']
              assert receipt['trustedWorkflowRef'] == os.environ['CANDIDATE_WORKFLOW_REF']
          assert pre['effectiveSourceSha'] == source and pre['status'] == 'generated-unreviewed'
          assert pre['afterSha256'] == built['generatedRouteSha256'] == expected
          assert digest(preflight / 'routeTree.gen.ts') == digest(build / 'routeTree.gen.ts') == expected
          assert built['preflightReceiptSha256'] == digest(preflight / 'receipt.json')
          assert pre['generatorVersion'] == '1.167.12' and pre['config'] == {'autoCodeSplitting': True}
          assert (preflight / 'routeTree.diff').is_file()
          PYROUTE
      - name: Verify isolated release payload
        run: |
          set -euo pipefail
          test -s release-assets/nightly-linux.yml
          test -s release-assets/nightly.yml
          test -s release-assets/weasel-linux-x64.tar.gz
          test -s "release-assets/T3-Code-0.1.2-nightly.20261016.36-x86_64.AppImage"
          test -s release-assets/install-linux.sh
          test -s "release-assets/T3-Code-0.1.2-nightly.20261016.36-x86_64-linux-nix-closure.nar.zst"
          test -s "release-assets/T3-Code-0.1.2-nightly.20261016.36-x86_64-linux-nix-closure.json"
          bash scripts/weasel/verify-nixos-closure.sh "0.1.2-nightly.20261016.36" release-assets
          test -n "$(find release-assets -maxdepth 1 -name 't3-*-linux-x64.tar.gz' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -name 't3-*-win32-x64.zip' -print -quit)"
          ! find release-assets -maxdepth 1 -type f \( -name '*apk' -o -name '*aab' -o -name '*ipa' \) | grep -q .
          bash scripts/weasel/verify-published-release.sh --write-checksums "0.1.2-nightly.20261016.36" release-assets
      - name: Create fork-only prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: morrowbyte/t3code
          OBSERVATORY_ROUTE_SHA: 4a398647bcd2507fd8aabab1ea0119b5bb635ccb880f4c73f0570f533650480e
          CANDIDATE_RUN_ID: "38943743329"
          CANDIDATE_RUN_ATTEMPT: "1"
          CANDIDATE_PROOF_SHA256: 01cf3cdc91c0b7364bcf8ec78243d08afc43c4df539e2097557a32f69abb2222
        run: |
          set -euo pipefail
          tag="v0.1.2-nightly.20261016.36"
          source_sha="7135fab0a9b001751943684e055b953c125d4c55"
          version="0.1.2-nightly.20261016.36"
          assert_draft_release() {
            local release_state is_draft target_commitish
            release_state="$(gh release view "$tag" --json isDraft,targetCommitish)"
            is_draft="$(jq -r .isDraft <<<"$release_state")"
            target_commitish="$(jq -r .targetCommitish <<<"$release_state")"
            if [[ "$is_draft" != "true" ]]; then
              echo "Release tag $tag is already published and immutable; refusing to overwrite its assets." >&2
              return 1
            fi
            if [[ "$target_commitish" != "$source_sha" ]]; then
              echo "Release tag $tag already points to $target_commitish, refusing to replace it." >&2
              return 1
            fi
          }
          if gh release view "$tag" >/dev/null 2>&1; then
            release_state="$(gh release view "$tag" --json isDraft,targetCommitish)"
            if [[ "$(jq -r .isDraft <<<"$release_state")" == "false" ]]; then
              bash scripts/weasel/verify-published-release.sh \
                "$tag" "$source_sha" "$version" release-assets
              exit 0
            fi
            assert_draft_release
          else
            gh release create "$tag" \
              --target "$source_sha" \
              --title "Weasel Nightly 0.1.2-nightly.20261016.36" \
              --prerelease \
              --draft \
              --notes "Fork channel build from $source_sha. Linux AppImage installs include a user-local installer. NixOS installs use the dedicated package and updater launcher when available at https://github.com/$GH_REPO/tree/main/packaging/nixos. Linux auto-updates stay disabled for Nix store installs. This build has no configured T3 Connect relay backend."
          fi
          # Asset replacement is permitted only while the release is still a
          # draft. Recheck immediately before each clobber in case a maintainer
          # published it while the job was preparing the payload.
          assert_draft_release
          gh release upload "$tag" release-assets/* --clobber

          lock_sha="$(sha256sum pnpm-lock.yaml | cut -d ' ' -f 1)"
          assets_json="$(bash scripts/weasel/read-draft-release-assets.sh "$tag" "$source_sha")"
          jq -e 'length > 0 and all(.[]; (.digest | type == "string") and (.digest | startswith("sha256:")))' <<<"$assets_json"
          expected_assets="$(find release-assets -maxdepth 1 -type f ! -name 'RELEASE-RECEIPT.txt' -printf '%f\n' | jq -Rsc 'split("\n") | map(select(length > 0)) | sort')"
          jq -e --argjson expected "$expected_assets" '([.[].name] | sort) == $expected' <<<"$assets_json"
          {
            printf 'fork_release=%s\nsource_sha=%s\npnpm_lock_sha256=%s\n' "$tag" "$source_sha" "$lock_sha"
            if [[ -f apps/web/src/routes/observatory.tsx ]]; then
              test "$OBSERVATORY_ROUTE_SHA" = 4a398647bcd2507fd8aabab1ea0119b5bb635ccb880f4c73f0570f533650480e
              printf 'generated_route_sha256=%s\ngenerated_route_source_sha=%s\ngenerated_route_run_id=%s\ngenerated_route_run_attempt=%s\n' \
                "$OBSERVATORY_ROUTE_SHA" "$source_sha" "$CANDIDATE_RUN_ID" "$CANDIDATE_RUN_ATTEMPT"
            fi
            printf 'candidate_run_id=%s\ncandidate_run_attempt=%s\ncandidate_proof_sha256=%s\npromotion_run_id=%s\npromotion_run_attempt=%s\npromotion_workflow_sha=%s\n' \
              "$CANDIDATE_RUN_ID" "$CANDIDATE_RUN_ATTEMPT" "$CANDIDATE_PROOF_SHA256" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_WORKFLOW_SHA"
            printf 'github_asset_digests=%s\n' "$(jq -c '[.[] | {name, digest}]' <<<"$assets_json")"
            printf 'artifact_sha256:\n'
            cat release-assets/SHA256SUMS
          } > release-assets/RELEASE-RECEIPT.txt
          assert_draft_release
          gh release upload "$tag" release-assets/RELEASE-RECEIPT.txt --clobber
          gh release edit "$tag" --draft=false
      - name: Retain promotion metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weasel-promotion-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |-
            ${{ runner.temp }}/verified-candidate-promotion/*.json
            ${{ runner.temp }}/verified-candidate-promotion/*.txt
          if-no-files-found: warn
          retention-days: 7
