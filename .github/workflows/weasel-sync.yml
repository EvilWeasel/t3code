name: Weasel upstream nightly sync

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

concurrency:
  group: weasel-upstream-sync
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  sync:
    if: github.repository == (vars.WEASEL_RELEASE_REPOSITORY || 'EvilWeasel/t3code')
    runs-on: ${{ vars.WEASEL_LINUX_RUNNER || 'namespace-profile-ci-builder' }}
    timeout-minutes: 35
    steps:
      - name: Require workflow-capable upstream sync token
        env:
          WEASEL_UPSTREAM_TOKEN: ${{ secrets.WEASEL_UPSTREAM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$WEASEL_UPSTREAM_TOKEN" ]]; then
            echo "Repository Actions secret WEASEL_UPSTREAM_TOKEN is required for sync checkout, GitHub API calls, and fast-forward promotion." >&2
            exit 1
          fi

      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.WEASEL_UPSTREAM_TOKEN }}

      - name: Configure upstream remote
        run: git remote add upstream https://github.com/pingdotgg/t3code.git

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Sync, validate, and promote latest published nightly
        env:
          GH_TOKEN: ${{ secrets.WEASEL_UPSTREAM_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/weasel/sync-upstream-nightly.sh
