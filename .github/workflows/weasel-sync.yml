name: Weasel upstream nightly sync

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

concurrency:
  group: weasel-upstream-sync
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  sync:
    if: github.repository == 'EvilWeasel/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure upstream remote
        run: git remote add upstream https://github.com/pingdotgg/t3code.git

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Sync, validate, and promote latest published nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/weasel/sync-upstream-nightly.sh
